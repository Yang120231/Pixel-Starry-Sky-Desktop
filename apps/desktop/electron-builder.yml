# 打包配置（electron-builder）。用法：仓库根目录执行 pnpm dist，产物在 apps/desktop/release/
appId: com.pixelsky.desktop
productName: 像素星空
# 下载 Electron 运行时用国内镜像（electron-builder 也认 ELECTRON_MIRROR 环境变量，可覆盖）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
directories:
  output: release
  buildResources: build
# 界面依赖已由 Vite 打进 out/，安装包里只需要构建产物
files:
  - out/**
  - package.json
asar: true
# 托盘图标（docs/ui/tray.md §2.5）：运行时从 resources/tray 读，不进 asar
extraResources:
  - from: build/tray
    to: tray
# node-pty 使用其自带的 win32-x64 N-API 预编译文件；本机构建工具未安装 Spectre 缓解库，
# 强制重编译会失败。Electron 44 已通过实际 PTY 输入 / resize / 退出验证。
npmRebuild: false
win:
  # 安装版（能自动更新）+ 便携版（不能自动更新，只提示去下载）。docs/release-update.md §7
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  # 暂不签名（首次运行 SmartScreen 会提示“未知发布者”），但仍写入产品名、版本等文件信息
  signExecutable: false
  icon: build/icon.ico
nsis:
  # 安装向导（docs/release-update.md §9）：先选「仅为我 / 所有用户」（默认仅为我，不要管理员），再选安装位置，装完勾选运行
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # 跟系统语言：中文系统显示中文，其余显示英文
  installerLanguages: [zh_CN, en_US]
  # build/installer.nsh：安装文件夹名改成 PixelSky；选完位置后补 \PixelSky 子文件夹（卸载删不到别的文件）、检查写权限
  include: build/installer.nsh
  artifactName: PixelSky-${version}-setup.exe
  uninstallDisplayName: ${productName}
portable:
  artifactName: PixelSky-${version}-portable.exe
# 更新源：GitHub Releases（CI 推 v* 标签时上传；本机 pnpm dist 不上传）
publish:
  provider: github
  owner: xiaoheoxo
  repo: Pixel-Starry-Sky-Desktop
  releaseType: draft
# 测试版也只生成 latest.yml：electron-updater 在测试版 Release 里找不到 beta.yml 时会回落到 latest.yml
